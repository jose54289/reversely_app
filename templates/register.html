<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Registro - Reversely AI</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Crear Cuenta (3 Créditos Gratis)</h2>
        {% if error %}<p class="bg-red-500 text-white p-2 rounded mb-4 text-sm">{{ error }}</p>{% endif %}
        <form method="POST">
            <div class="mb-4"><label class="block mb-2">Correo</label><input type="email" name="email" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
            <div class="mb-6"><label class="block mb-2">Contraseña</label><input type="password" name="password" required class="w-full p-2 rounded bg-gray-700 text-white"></div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-2 rounded font-bold">Registrarse</button>
        </form>
        <p class="mt-4 text-center text-sm">¿Ya tienes cuenta? <a href="/login" class="text-blue-400 underline">Inicia sesión</a></p>
    </div>
</body>
</html>
